<div class="flex min-h-screen items-center justify-center bg-bg p-6">
  <div class="max-w-md text-center">
    <svg
      class="mx-auto size-10 text-text-muted"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>

    <p class="mt-4 mb-0 text-meta font-medium tracking-wide text-text-muted">{{ 'errors.notFound.code' | t }}</p>
    <h1 class="mt-1 mb-0 text-page-title font-semibold text-text">{{ 'errors.notFound.title' | t }}</h1>
    <p class="mt-2 mb-0 text-body text-text-secondary">
{{ 'errors.notFound.message' | t }}
    </p>

    <a class="btn-primary mt-6" routerLink="/dashboard">{{ 'errors.backToDashboard' | t }}</a>
  </div>
</div>
