<app-page-header [title]="'users.title' | t" [subtitle]="'users.subtitle' | t">
  <a *hasPermission="'users.create'" class="btn-primary" routerLink="/users/create">{{ 'users.add' | t }}</a>
</app-page-header>

<div class="mb-4 flex flex-wrap gap-3">
  <input
    type="search"
    class="field max-w-80 flex-1"
    [placeholder]="'users.searchPlaceholder' | t"
    [attr.aria-label]="'users.searchLabel' | t"
    [value]="filters().search"
    (input)="onSearch($any($event.target).value)"
  />

  <select
    class="field w-48"
    [attr.aria-label]="'users.filterRole' | t"
    [value]="filters().role ?? ''"
    (change)="onRole($any($event.target).value)"
  >
    <option value="">{{ 'users.allRoles' | t }}</option>
    @for (role of roles(); track role.id) {
      <option [value]="role.name">{{ role.display_name }}</option>
    }
  </select>

  <select
    class="field w-40"
    [attr.aria-label]="'users.filterStatus' | t"
    [value]="filters().status ?? ''"
    (change)="onStatus($any($event.target).value)"
  >
    <option value="">{{ 'common.allStatuses' | t }}</option>
    <option value="active">{{ 'common.active' | t }}</option>
    <option value="inactive">{{ 'common.inactive' | t }}</option>
  </select>

  @if (filtered()) {
    <button type="button" class="btn-quiet" (click)="clearFilters()">{{ 'common.clearFilters' | t }}</button>
  }
</div>

<app-data-table
  [rows]="rows()"
  [columns]="columns()"
  [meta]="meta()"
  [loading]="loading()"
  [failed]="failed()"
  [filtered]="filtered()"
  [skeletonRows]="6"
  [errorHeading]="'users.errorHeading' | t"
  [errorMessage]="'common.loadFailed' | t"
  [emptyHeading]="'users.emptyHeading' | t"
  [emptyMessage]="'users.emptyMessage' | t"
  [filteredHeading]="'users.filteredHeading' | t"
  [filteredMessage]="'users.filteredMessage' | t"
  [retryLabel]="'common.tryAgain' | t"
  [clearFiltersLabel]="'common.clearFilters' | t"
  [loadingLabel]="'common.loading' | t"
  [paginationSummary]="'common.paginationSummary' | t"
  [previousLabel]="'common.previousPage' | t"
  [nextLabel]="'common.nextPage' | t"
  (retry)="load()"
  (clearFilters)="clearFilters()"
  (pageChange)="onPage($event)"
>
    <th
      actionsHeader
      class="w-36 px-4 py-3 text-end font-medium"
    >
      {{ 'common.actions' | t }}
    </th>

  <a *hasPermission="'users.create'" emptyAction class="btn-primary" routerLink="/users/create">
    {{ 'users.add' | t }}
  </a>

  <ng-template #row let-user>
    <tr class="border-b border-border last:border-b-0 hover:bg-bg">
      <td class="px-4 py-3 text-text">{{ user.name }}</td>
      <td class="px-4 py-3 text-text-secondary">{{ user.email }}</td>
      <td class="px-4 py-3 text-text-secondary">{{ user.role_display_name }}</td>
      <td class="px-4 py-3">
        <app-status-badge [active]="user.is_active" [label]="user.status_label" />
      </td>
      <td class="px-4 py-3">
        <div class="flex items-center justify-end gap-1">
          <button
            *hasPermission="'users.update'"
            type="button"
            role="switch"
            class="toggle"
            [class.is-on]="user.is_active"
            [attr.aria-checked]="user.is_active"
            [attr.aria-label]="
              (user.is_active ? 'users.deactivate' : 'users.activate')
                | t: { name: user.name }
            "
            [disabled]="togglingId() === user.id || isSelf(user)"
            [title]="isSelf(user) ? ('users.cannotDeactivateSelf' | t) : ''"
            (click)="toggleStatus(user)"
          >
            <span class="toggle-knob"></span>
          </button>

          <a
            class="icon-btn"
            [routerLink]="['/users', user.id]"
            [attr.aria-label]="'users.view' | t: { name: user.name }"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </a>

          <a
            *hasPermission="'users.update'"
            class="icon-btn"
            [routerLink]="['/users', user.id, 'edit']"
            [attr.aria-label]="'users.editAria' | t: { name: user.name }"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </a>

          <button
            *hasPermission="'users.delete'"
            type="button"
            class="icon-btn icon-btn-danger"
            [attr.aria-label]="'users.deleteAria' | t: { name: user.name }"
            [disabled]="isSelf(user)"
            [title]="isSelf(user) ? ('users.cannotDeleteSelf' | t) : ''"
            (click)="askDelete(user)"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14H6L5 6" />
            </svg>
          </button>
        </div>
      </td>
    </tr>
  </ng-template>
</app-data-table>

@if (pendingDelete(); as user) {
  <app-confirm-dialog
    [heading]="'users.deleteHeading' | t"
    [message]="'users.deleteMessage' | t: { name: user.name }"
    [confirmLabel]="'common.delete' | t"
    [cancelLabel]="'common.cancel' | t"
    [busyLabel]="'common.working' | t"
    [busy]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="pendingDelete.set(null)"
  />
}
