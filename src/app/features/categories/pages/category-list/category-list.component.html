<app-page-header [title]="'categories.title' | t" [subtitle]="'categories.subtitle' | t">
  <a *hasPermission="'categories.create'" class="btn-primary" routerLink="/categories/create">
    {{ 'categories.add' | t }}
  </a>
</app-page-header>

<div class="mb-4 flex flex-wrap gap-3">
  <input
    type="search"
    class="field max-w-80 flex-1"
    [placeholder]="'categories.searchPlaceholder' | t"
    [attr.aria-label]="'categories.searchLabel' | t"
    [value]="filters().search"
    (input)="onSearch($any($event.target).value)"
  />

  @if (filtered()) {
    <button type="button" class="btn-quiet" (click)="clearFilters()">{{ 'common.clearFilters' | t }}</button>
  }
</div>

<app-data-table
  [rows]="rows()"
  [columns]="columns()"
  [meta]="meta()"
  [loading]="loading()"
  [failed]="failed()"
  [filtered]="filtered()"
  [skeletonRows]="6"
  [errorHeading]="'categories.errorHeading' | t"
  [errorMessage]="'common.loadFailed' | t"
  [emptyHeading]="'categories.emptyHeading' | t"
  [emptyMessage]="'categories.emptyMessage' | t"
  [filteredHeading]="'categories.filteredHeading' | t"
  [filteredMessage]="'categories.filteredMessage' | t"
  [retryLabel]="'common.tryAgain' | t"
  [clearFiltersLabel]="'common.clearFilters' | t"
  [loadingLabel]="'common.loading' | t"
  [paginationSummary]="'common.paginationSummary' | t"
  [previousLabel]="'common.previousPage' | t"
  [nextLabel]="'common.nextPage' | t"
  (retry)="load()"
  (clearFilters)="clearFilters()"
  (pageChange)="onPage($event)"
>
  <a
    *hasPermission="'categories.create'"
    emptyAction
    class="btn-primary"
    routerLink="/categories/create"
  >
    {{ 'categories.add' | t }}
  </a>

  <ng-template #row let-category>
    <tr class="border-b border-border last:border-b-0 hover:bg-bg">
      <td class="px-4 py-3 text-text">{{ category.name }}</td>
      <td class="px-4 py-3 text-text-secondary">{{ category.description || ('common.none' | t) }}</td>
      <td class="px-4 py-3 text-end text-text tabular-nums">{{ category.products_count }}</td>
      <td class="px-4 py-3">
        <div class="flex items-center justify-end gap-1">
          <a
            *hasPermission="'categories.update'"
            class="icon-btn"
            [routerLink]="['/categories', category.id, 'edit']"
            [attr.aria-label]="'categories.editAria' | t: { name: category.name }"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </a>

          <button
            *hasPermission="'categories.delete'"
            type="button"
            class="icon-btn icon-btn-danger"
            [attr.aria-label]="'categories.deleteAria' | t: { name: category.name }"
            (click)="askDelete(category)"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14H6L5 6" />
            </svg>
          </button>
        </div>
      </td>
    </tr>
  </ng-template>
</app-data-table>

@if (pendingDelete(); as category) {
  <app-confirm-dialog
    [heading]="'categories.deleteHeading' | t"
    [message]="
      category.products_count > 0
        ? ('categories.deleteBlocked' | t: { name: category.name, count: category.products_count })
        : ('categories.deleteMessage' | t: { name: category.name })
    "
    [confirmLabel]="'common.delete' | t"
    [cancelLabel]="'common.cancel' | t"
    [busyLabel]="'common.working' | t"
    [busy]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="pendingDelete.set(null)"
  />
}
