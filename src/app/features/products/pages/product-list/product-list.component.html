<app-page-header [title]="'products.title' | t" [subtitle]="'products.subtitle' | t">
  <a *hasPermission="'products.create'" class="btn-primary" routerLink="/products/create">
    {{ 'products.add' | t }}
  </a>
</app-page-header>

<div class="mb-4 flex flex-wrap gap-3">
  <input
    type="search"
    class="field max-w-80 flex-1"
    [placeholder]="'products.searchPlaceholder' | t"
    [attr.aria-label]="'products.searchLabel' | t"
    [value]="filters().search"
    (input)="onSearch($any($event.target).value)"
  />

  <select
    class="field w-48"
    [attr.aria-label]="'products.filterCategory' | t"
    [value]="filters().category_id ?? ''"
    (change)="onCategory($any($event.target).value)"
  >
    <option value="">{{ 'products.allCategories' | t }}</option>
    @for (category of categories(); track category.id) {
      <option [value]="category.id">{{ category.name }}</option>
    }
  </select>

  <select
    class="field w-40"
    [attr.aria-label]="'products.filterStatus' | t"
    [value]="filters().status ?? ''"
    (change)="onStatus($any($event.target).value)"
  >
    <option value="">{{ 'common.allStatuses' | t }}</option>
    <option value="active">{{ 'common.active' | t }}</option>
    <option value="inactive">{{ 'common.inactive' | t }}</option>
  </select>

  @if (filtered()) {
    <button type="button" class="btn-quiet" (click)="clearFilters()">{{ 'common.clearFilters' | t }}</button>
  }
</div>

<app-data-table
  [rows]="rows()"
  [columns]="columns()"
  [meta]="meta()"
  [loading]="loading()"
  [failed]="failed()"
  [filtered]="filtered()"
  [errorHeading]="'products.errorHeading' | t"
  [errorMessage]="'common.loadFailed' | t"
  [emptyHeading]="'products.emptyHeading' | t"
  [emptyMessage]="'products.emptyMessage' | t"
  [filteredHeading]="'products.filteredHeading' | t"
  [filteredMessage]="'products.filteredMessage' | t"
  [retryLabel]="'common.tryAgain' | t"
  [clearFiltersLabel]="'common.clearFilters' | t"
  [loadingLabel]="'common.loading' | t"
  [paginationSummary]="'common.paginationSummary' | t"
  [previousLabel]="'common.previousPage' | t"
  [nextLabel]="'common.nextPage' | t"
  (retry)="load()"
  (clearFilters)="clearFilters()"
  (pageChange)="onPage($event)"
>
    <th
      actionsHeader
      class="w-28 px-4 py-3 text-end font-medium"
    >
      {{ 'common.actions' | t }}
    </th>

  <a
    *hasPermission="'products.create'"
    emptyAction
    class="btn-primary"
    routerLink="/products/create"
  >
    {{ 'products.add' | t }}
  </a>

  <ng-template #row let-product>
    <tr class="border-b border-border last:border-b-0 hover:bg-bg">
      <td class="px-4 py-2">
        @if (product.image_url) {
          <img
            [src]="product.image_url"
            [alt]="product.name"
            class="size-10 rounded-sm border border-border object-cover"
          />
        } @else {
          <div
            class="flex size-10 items-center justify-center rounded-sm border border-border bg-bg text-meta text-text-muted"
            aria-hidden="true"
          >
            —
          </div>
        }
      </td>
      <td class="px-4 py-2 text-text">{{ product.name }}</td>
      <td class="px-4 py-2 text-text-secondary">{{ product.category.name }}</td>
      <td class="px-4 py-2 text-end text-text tabular-nums">{{ product.price | price }}</td>
      <td class="px-4 py-2 text-end text-text tabular-nums">{{ product.stock }}</td>
      <td class="px-4 py-2">
        <app-status-badge [active]="product.is_active" [label]="product.status_label" />
      </td>
      <td class="px-4 py-2">
        <div class="flex items-center justify-end gap-1">
          <a
            class="icon-btn"
            [routerLink]="['/products', product.id]"
            [attr.aria-label]="'products.view' | t: { name: product.name }"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </a>

          <a
            *hasPermission="'products.update'"
            class="icon-btn"
            [routerLink]="['/products', product.id, 'edit']"
            [attr.aria-label]="'products.editAria' | t: { name: product.name }"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </a>

          <button
            *hasPermission="'products.delete'"
            type="button"
            class="icon-btn icon-btn-danger"
            [attr.aria-label]="'products.deleteAria' | t: { name: product.name }"
            (click)="askDelete(product)"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14H6L5 6" />
            </svg>
          </button>
        </div>
      </td>
    </tr>
  </ng-template>
</app-data-table>

@if (pendingDelete(); as product) {
  <app-confirm-dialog
    [heading]="'products.deleteHeading' | t"
    [message]="'products.deleteMessage' | t: { name: product.name }"
    [confirmLabel]="'common.delete' | t"
    [cancelLabel]="'common.cancel' | t"
    [busyLabel]="'common.working' | t"
    [busy]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="pendingDelete.set(null)"
  />
}
