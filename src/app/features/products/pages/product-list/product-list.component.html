<app-page-header title="Products" subtitle="Everything in the catalog.">
  <a *hasPermission="'products.create'" class="btn-primary" routerLink="/products/create">
    Add product
  </a>
</app-page-header>

<div class="mb-4 flex flex-wrap gap-3">
  <input
    type="search"
    class="field max-w-80 flex-1"
    placeholder="Search products…"
    aria-label="Search products by name"
    [value]="filters().search"
    (input)="onSearch($any($event.target).value)"
  />

  <select
    class="field w-48"
    aria-label="Filter by category"
    [value]="filters().category_id ?? ''"
    (change)="onCategory($any($event.target).value)"
  >
    <option value="">All categories</option>
    @for (category of categories(); track category.id) {
      <option [value]="category.id">{{ category.name }}</option>
    }
  </select>

  <select
    class="field w-40"
    aria-label="Filter by status"
    [value]="filters().status ?? ''"
    (change)="onStatus($any($event.target).value)"
  >
    <option value="">All statuses</option>
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>

  @if (filtered()) {
    <button type="button" class="btn-quiet" (click)="clearFilters()">Clear filters</button>
  }
</div>

<app-data-table
  [rows]="rows()"
  [columns]="columns"
  [meta]="meta()"
  [loading]="loading()"
  [failed]="failed()"
  [filtered]="filtered()"
  errorHeading="Could not load products"
  emptyHeading="No products yet"
  emptyMessage="Add the first one to get started."
  filteredHeading="No products match these filters"
  filteredMessage="Try a different search term, or clear the filters to see everything."
  (retry)="load()"
  (clearFilters)="clearFilters()"
  (pageChange)="onPage($event)"
>
  <a
    *hasPermission="'products.create'"
    emptyAction
    class="btn-primary"
    routerLink="/products/create"
  >
    Add product
  </a>

  <ng-template #row let-product>
    <tr class="border-b border-border last:border-b-0 hover:bg-bg">
      <td class="px-4 py-2">
        @if (product.image_url) {
          <img
            [src]="product.image_url"
            [alt]="product.name"
            class="size-10 rounded-sm border border-border object-cover"
          />
        } @else {
          <div
            class="flex size-10 items-center justify-center rounded-sm border border-border bg-bg text-meta text-text-muted"
            aria-hidden="true"
          >
            —
          </div>
        }
      </td>
      <td class="px-4 py-2 text-text">{{ product.name }}</td>
      <td class="px-4 py-2 text-text-secondary">{{ product.category.name }}</td>
      <td class="px-4 py-2 text-end text-text tabular-nums">{{ product.price | price }}</td>
      <td class="px-4 py-2 text-end text-text tabular-nums">{{ product.stock }}</td>
      <td class="px-4 py-2">
        <app-status-badge [active]="product.is_active" [label]="product.status_label" />
      </td>
      <td class="px-4 py-2">
        <div class="flex items-center justify-end gap-1">
          <a
            class="icon-btn"
            [routerLink]="['/products', product.id]"
            [attr.aria-label]="'View ' + product.name"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </a>

          <a
            *hasPermission="'products.update'"
            class="icon-btn"
            [routerLink]="['/products', product.id, 'edit']"
            [attr.aria-label]="'Edit ' + product.name"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </a>

          <button
            *hasPermission="'products.delete'"
            type="button"
            class="icon-btn icon-btn-danger"
            [attr.aria-label]="'Delete ' + product.name"
            (click)="askDelete(product)"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6l-1 14H6L5 6" />
            </svg>
          </button>
        </div>
      </td>
    </tr>
  </ng-template>
</app-data-table>

@if (pendingDelete(); as product) {
  <app-confirm-dialog
    heading="Delete this product?"
    [message]="product.name + ' will be removed. This cannot be undone.'"
    confirmLabel="Delete"
    [busy]="deleting()"
    (confirmed)="confirmDelete()"
    (cancelled)="pendingDelete.set(null)"
  />
}
