<div class="overflow-hidden rounded-md border border-border bg-surface">
  @if (loading()) {
    <app-table-skeleton
      [rows]="skeletonRows()"
      [columns]="columns().length"
      [loadingLabel]="loadingLabel()"
    />
  } @else if (failed()) {
    <app-empty-state [heading]="errorHeading()" [message]="errorMessage()">
      <button type="button" class="btn-primary" (click)="retry.emit()">
        {{ retryLabel() }}
      </button>
    </app-empty-state>
  } @else if (isEmpty() && filtered()) {
    <app-empty-state [heading]="filteredHeading()" [message]="filteredMessage()">
      <button type="button" class="btn-quiet" (click)="clearFilters.emit()">
        {{ clearFiltersLabel() }}
      </button>
    </app-empty-state>
  } @else if (isEmpty()) {
    <app-empty-state [heading]="emptyHeading()" [message]="emptyMessage()">
      <ng-content select="[emptyAction]" />
    </app-empty-state>
  } @else {
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-table">
        <thead>
          <tr class="border-b border-border text-meta text-text-secondary">
            @for (column of columns(); track column.label) {
              <th [class]="headerClass(column)">{{ column.label }}</th>
            }
            <!-- Projected so the feature can gate it with *hasPermission; a user
                 with no row action gets no column rather than an empty one. -->
            <ng-content select="[actionsHeader]" />
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track row.id) {
            <ng-container
              [ngTemplateOutlet]="rowTemplate()"
              [ngTemplateOutletContext]="{ $implicit: row }"
            />
          }
        </tbody>
      </table>
    </div>

    @if (meta(); as pageMeta) {
      <app-pagination
        [meta]="pageMeta"
        [summary]="paginationSummary()"
        [previousLabel]="previousLabel()"
        [nextLabel]="nextLabel()"
        (pageChange)="pageChange.emit($event)"
      />
    }
  }
</div>
