<header class="flex h-14 items-center justify-between border-b border-border bg-surface px-6">
  <span class="text-section font-semibold text-primary">{{ 'app.name' | t }}</span>

  <div class="flex items-center gap-4">
    <select
      class="field h-8 w-32 text-meta"
      [attr.aria-label]="'topbar.language' | t"
      [value]="locale()"
      (change)="switchLocale($any($event.target).value)"
    >
      <option value="en">{{ 'topbar.english' | t }}</option>
      <option value="ar">{{ 'topbar.arabic' | t }}</option>
    </select>

    @if (user(); as current) {
      <div class="flex flex-col items-end leading-tight">
        <span class="text-body text-text">{{ current.name }}</span>
        <span class="text-meta text-text-muted">{{ current.role_display_name }}</span>
      </div>
    }

    <button
      type="button"
      class="inline-flex h-9 cursor-pointer items-center gap-2 rounded-md border-0 bg-transparent px-3 text-body text-text-secondary transition-colors hover:bg-bg hover:text-text active:bg-border focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      (click)="logout()"
    >
      <svg
        class="size-4 rtl:-scale-x-100"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="m16 17 5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
      <span>{{ 'topbar.logout' | t }}</span>
    </button>
  </div>
</header>
