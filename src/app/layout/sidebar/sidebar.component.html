<nav class="nav" aria-label="Main">
  <ul class="flex list-none flex-col gap-1 p-3 m-0">
    @for (item of visibleItems(); track item.route) {
      <li>
        <a
          class="link flex items-center gap-2.5 rounded-sm px-2.5 py-2 text-body text-text-secondary no-underline transition-colors hover:bg-bg hover:text-text active:bg-border focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        >
          <svg
            class="size-4.5 shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            @switch (item.icon) {
              @case ('home') {
                <path d="M3 10.5 12 3l9 7.5" />
                <path d="M5 9.5V21h14V9.5" />
              }
              @case ('box') {
                <path d="M21 8 12 3 3 8v8l9 5 9-5V8Z" />
                <path d="m3 8 9 5 9-5" />
                <path d="M12 13v8" />
              }
              @case ('tag') {
                <path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9Z" />
                <circle cx="7.5" cy="7.5" r="1.5" />
              }
              @case ('users') {
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              }
              @case ('shield') {
                <path d="M12 3l8 3v6c0 5-3.4 8.3-8 9-4.6-.7-8-4-8-9V6l8-3Z" />
              }
            }
          </svg>
          <span>{{ item.labelKey | t }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
